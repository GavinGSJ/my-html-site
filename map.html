<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INPEX Strategic Distribution Map 2026</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        :root {
            --mck-navy: #002D72;
            --mck-teal: #00A9E0;
            --mck-gold: #FFC72C;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            font-family: 'Inter', sans-serif;
            background: #ffffff;
        }

        #map { height: 100vh; width: 100%; z-index: 1; }

        /* 悬浮标题与图例 */
        .overlay-panel {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-left: 4px solid var(--mck-navy);
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            pointer-events: none;
        }

        /* 悬停提示框样式 */
        .custom-tooltip {
            background: rgba(255, 255, 255, 0.96) !important;
            border: none !important;
            border-radius: 4px !important;
            box-shadow: 0 15px 35px rgba(0,0,0,0.12) !important;
            padding: 0 !important;
            overflow: hidden;
            border-bottom: 3px solid var(--mck-gold) !important;
        }

        .tooltip-content {
            width: 260px;
        }

        .tooltip-header {
            background: var(--mck-navy);
            color: white;
            padding: 10px 15px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .tooltip-body {
            padding: 15px;
        }

        /* 动画效果 */
        .asset-marker {
            transition: all 0.3s ease-out;
            cursor: pointer;
        }

        .leaflet-control-attribution { display: none; }
    </style>
</head>
<body>

    <!-- 悬浮控制台 -->
    <div class="overlay-panel">
        <h1 class="text-2xl font-black text-[#002D72] tracking-tighter mb-1">INPEX</h1>
        <p class="text-[10px] font-bold text-gray-400 tracking-[0.2em] mb-6 uppercase">Strategic Distribution 2026</p>
        
        <div class="space-y-3">
            <div class="flex items-center text-xs font-semibold text-gray-700">
                <span class="w-3 h-3 rounded-full bg-[#002D72] mr-3"></span> 传统油气核心资产 (O&G)
            </div>
            <div class="flex items-center text-xs font-semibold text-gray-700">
                <span class="w-3 h-3 rounded-full bg-[#00A9E0] mr-3"></span> 低碳/氢能/CCS 业务
            </div>
            <div class="mt-6 pt-4 border-t border-gray-200">
                <div class="text-[9px] text-gray-400">项目圆点大小代表 2025-2031 预估总支出</div>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const assets = [
            { name: "Abadi LNG Project", type: "og", sector: "Upstream O&G", country: "Indonesia", lat: -8.2, lon: 131.0, spend: "11.4B", status: "Discovery (2032)", partner: "Worley, Fugro" },
            { name: "Ichthys Field", type: "og", sector: "Upstream O&G", country: "Australia", lat: -13.8, lon: 124.8, spend: "7.7B", status: "Producing", partner: "Floatel, GR Engineering" },
            { name: "Minami Nagaoka", type: "og", sector: "Upstream O&G", country: "Japan", lat: 37.3, lon: 138.8, spend: "0.5B", status: "Producing", partner: "In-house" },
            { name: "Malaysia Blocks", type: "og", sector: "Exploration", country: "Malaysia", lat: 5.2, lon: 115.0, spend: "0.7B", status: "Undiscovered", partner: "TBD" },
            { name: "Ramhan/Hudairiat", type: "og", sector: "Upstream O&G", country: "UAE", lat: 24.4, lon: 54.3, spend: "0.1B", status: "Discovery", partner: "ADNOC JV" },
            { name: "Niigata Blue Hydrogen", type: "lc", sector: "Hydrogen", country: "Japan", lat: 37.9, lon: 139.0, spend: "0.65B", status: "Potential (2030)", partner: "Planning" },
            { name: "Houston Ammonia", type: "lc", sector: "CCUS/Ammonia", country: "USA", lat: 29.7, lon: -95.3, spend: "0.46B", status: "Potential (2030)", partner: "Air Liquide, Chevron" },
            { name: "Bonaparte Basin CCS", type: "lc", sector: "CCUS", country: "Australia", lat: -12.0, lon: 129.0, spend: "0.27B", status: "Development (2031)", partner: "Engineering" },
            { name: "Metropolitan Area Pipeline", type: "lc", sector: "CCUS", country: "Japan", lat: 35.6, lon: 139.7, spend: "0.21B", status: "Development (2031)", partner: "JV Partners" }
        ];

        const map = L.map('map', {
            center: [15, 110],
            zoom: 3,
            zoomControl: false,
            minZoom: 2
        });

        // 使用极简底图
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

        assets.forEach(asset => {
            const color = asset.type === 'og' ? '#002D72' : '#00A9E0';
            const radius = Math.sqrt(parseFloat(asset.spend) || 0.1) * 10 + 6;

            const marker = L.circleMarker([asset.lat, asset.lon], {
                radius: radius,
                fillColor: color,
                color: '#FFFFFF',
                weight: 3,
                opacity: 1,
                fillOpacity: 0.8,
                className: 'asset-marker'
            }).addTo(map);

            const tooltipHtml = `
                <div class="tooltip-content">
                    <div class="tooltip-header">${asset.sector} | ${asset.country}</div>
                    <div class="tooltip-body">
                        <div class="text-lg font-bold text-[#002D72] leading-tight mb-2">${asset.name}</div>
                        <div class="flex justify-between items-end">
                            <div>
                                <div class="text-[9px] text-gray-400 font-bold uppercase tracking-tighter">预计总投资</div>
                                <div class="text-base font-black text-blue-600">$${asset.spend}</div>
                            </div>
                            <div class="text-right">
                                <div class="text-[9px] text-gray-400 font-bold uppercase tracking-tighter">状态</div>
                                <div class="text-[11px] font-bold text-gray-700">${asset.status}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            marker.bindTooltip(tooltipHtml, {
                direction: 'top',
                className: 'custom-tooltip',
                offset: [0, -10],
                opacity: 1
            });

            // 交互动效
            marker.on('mouseover', function(e) {
                this.setStyle({ fillOpacity: 1, weight: 5, fillColor: '#FFC72C' });
            });
            marker.on('mouseout', function(e) {
                this.setStyle({ fillOpacity: 0.8, weight: 3, fillColor: color });
            });
        });

        // 视角快捷键
        L.control.zoom({ position: 'bottomright' }).addTo(map);
    </script>
</body>
</html>
