        html,
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden !important;
            font-family: 'Inter', sans-serif;
            background-color: #fff
        }

        .f-title-cn {
            font-size: clamp(24px, 6.5vmin, 52px);
            font-weight: 900;
            line-height: 1.15;
            letter-spacing: -.03em
        }

        .f-title-en {
            font-size: clamp(10px, 1.6vmin, 18px);
            font-weight: 700;
            letter-spacing: .3em;
            color: #94a3b8;
            margin-top: 1.5vmin
        }

        .f-tag-label {
            font-size: clamp(10px, 1.4vmin, 14px);
            font-weight: 900;
            letter-spacing: .25em;
            color: #00205B;
            margin-bottom: 4vmin
        }

        .f-list-text {
            font-size: clamp(24px, 6.5vmin, 68px);
            font-weight: 300;
            color: #334155;
            letter-spacing: -.04em;
            line-height: 1.2;
            margin-bottom: 2vmin
        }

        .f-info-text {
            font-size: clamp(12px, 2.2vmin, 24px);
            font-weight: 600;
            color: #334155

        .f-info-label {
            font-size: clamp(8px, 1.1vmin, 10px);
            font-weight: 900;
            color: #94a3b8
        }

        .banner-wrapper {
            display: flex;
            height: 100vh;
            width: 100vw;
            border-left: clamp(15px, 3vmin, 40px) solid #00205B;
            box-sizing: border-box;
            background: #fff

        .left-panel {
            width: 42%;
            padding: clamp(30px, 8vmin, 80px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-shrink: 0;
            border-right: 1px solid #f1f5f9
        }

        .right-panel {
            width: 58%;
            padding: clamp(30px, 8vmin, 80px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: #F8FAFC;
            flex-shrink: 0;
            position: relative
        }

        .logo-box {
            width: clamp(100px, 32vmin, 260px);
            height: clamp(100px, 32vmin, 260px);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #00205B;
            margin-bottom: clamp(30px, 7vmin, 70px)
        }

        .wrap-text {
            word-break: break-word;
            overflow-wrap: anywhere
        }
    </style>
