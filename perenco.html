            width: 100vw;
            overflow: hidden !important;
            font-family: 'Inter', sans-serif;
            background-color: #fff

            line-height: 1.15;

        }

            font-size: clamp(10px, 1.6vmin, 18px);

            letter-spacing: .3em;

            width: 100vw;
            border-left: clamp(15px, 3vmin, 40px) solid #00205B;

            background: #fff

            flex-direction: column;
            justify-content: center;
            flex-shrink: 0;
            border-right: 1px solid #f1f5f9

        .right-panel {
            width: 58%;
            padding: clamp(30px, 8vmin, 80px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: #F8FAFC;
            flex-shrink: 0;
            position: relative
        }

            width: clamp(100px, 32vmin, 260px);
            height: clamp(100px, 32vmin, 260px);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #00205B;
            margin-bottom: clamp(30px, 7vmin, 70px)
        }

        .wrap-text {
            word-break: break-word;
            overflow-wrap: anywhere
        }
